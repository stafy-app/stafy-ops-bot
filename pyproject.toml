[project]
name = "stafy-ops-bot"
version = "0.1.0"
description = "Telegram bot that turns chat messages into well-formed GitHub issues on the Stafy project board"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.133",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "tzdata>=2024.1",  # IANA zones on Windows (zoneinfo has no system database there)
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stafy_ops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
